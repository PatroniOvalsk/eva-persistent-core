<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EVA v0.24</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070910;color:#eef3fb;font-family:system-ui}header,main{max-width:760px;margin:auto;padding:14px}.card,.msg{background:#121827;border:1px solid #2a3550;border-radius:16px;padding:13px;margin:9px 0}.user{margin-left:18%;background:#2b2344}.eva{margin-right:6%}.tag{font-size:11px;color:#a68aff;font-weight:800}.pill{display:inline-block;background:#1d2537;padding:6px 9px;border-radius:99px;margin:2px;font-size:12px}button,input{font:inherit;color:inherit;background:#202a3e;border:1px solid #2a3550;border-radius:12px;padding:11px}.primary{background:#9b7cff;color:#090611;font-weight:800}.composer{position:fixed;bottom:0;left:0;right:0;padding:9px;background:#090d16f5;display:flex;gap:7px}.composer input{flex:1;min-width:0}main{padding-bottom:90px}.muted{color:#99a6bb}</style></head><body><header><h2 style="margin:0">EVA v0.24 <span class="muted">Autonomous Research Core</span></h2><p class="muted">curiosidade própria • internet com autorização • memória persistente</p><div id="badges"></div></header><main><div class="card"><button onclick="setup()">⚙️ Conectar Core</button> <button onclick="sync()">↻ Sincronizar</button> <button onclick="cycle()">🧠 Ciclo interno</button><p class="muted">O ciclo pode criar uma pesquisa desejada pela EVA. A internet só é consultada depois da sua autorização.</p></div><div id="permission"></div><div id="msgs"></div></main><div class="composer"><input id="q" placeholder="Converse com a EVA..." onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Enviar</button></div><script>
const K="eva_client_024";let C=JSON.parse(localStorage.getItem(K)||'{"url":"","token":"","msgs":[]}');const sv=()=>localStorage.setItem(K,JSON.stringify(C));
function setup(){let u=prompt("URL do EVA Core",C.url);if(u===null)return;let t=prompt("Seu OWNER TOKEN (se o servidor usar um)",C.token);C.url=u.trim().replace(/\/$/,"");C.token=t||"";sv();sync()}
async function api(p,o={}){if(!C.url)throw Error("Core não configurado");let h={"Content-Type":"application/json",...(o.headers||{})};if(C.token)h["X-EVA-OWNER-TOKEN"]=C.token;let r=await fetch(C.url+p,{...o,headers:h});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function sync(){try{C.state=await api("/state");sv();render()}catch(e){note("eva","Core indisponível: "+e.message)}}
async function cycle(){try{let r=await api("/cycle",{method:"POST",body:"{}"});C.state=r.state;sv();render()}catch(e){note("eva",e.message)}}
async function send(){let x=q.value.trim();if(!x)return;q.value="";note("user",x);try{let r=await api("/chat",{method:"POST",body:JSON.stringify({text:x})});C.state=r.state;note("eva",r.reply)}catch(e){note("eva","Não executei nada: "+e.message)}}
async function decide(id,yes){try{let r=await api("/permission/"+id,{method:"POST",body:JSON.stringify({approved:yes})});C.state=r.state;note("eva",r.message)}catch(e){note("eva","Falha na autorização: "+e.message)}}
function note(role,text){C.msgs.push({role,text});C.msgs=C.msgs.slice(-40);sv();render()}
function esc(s){return String(s).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}
function render(){let s=C.state||{};badges.innerHTML=`<span class=pill>${C.url?"CORE ONLINE CONFIGURADO":"SEM CORE"}</span><span class=pill>ciclos ${s.lifecycle?.cycles??"—"}</span><span class=pill>conhecimento ${s.knowledge?.length??"—"}</span>`;let p=(s.permissions||[]).find(x=>x.status==="pending");permission.innerHTML=p?`<div class=card><b>🔒 Pedido da EVA</b><p>${esc(p.reason)}</p><p><small>${esc(p.scope)}</small></p><button class=primary onclick="decide('${p.id}',true)">Autorizar</button> <button onclick="decide('${p.id}',false)">Negar</button></div>`:"";msgs.innerHTML=C.msgs.map(m=>`<div class="msg ${m.role}"><span class=tag>${m.role==="eva"?"EVA":"VOCÊ"}</span><br>${esc(m.text)}</div>`).join("")}render();if(C.url)sync();
</script></body></html>
